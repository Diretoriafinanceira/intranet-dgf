        const senha = prompt(
            '🔒 Digite a senha corporativa para liberar as fichas e os cadastros:'
        );

            return;
        }

        btnAcesso.disabled = true;
        btnAcesso.textContent = '⏳ Validando...';

        try {
            await enviarAPI('autenticar', {}, senha);

            senhaAcesso = senha;
            autorizado = true;

            const resposta = await enviarAPI('listarPrivados');

            registrosPrivados = resposta.registros || [];

            atualizarBotoes();
            renderizarDashboard();

            alert(
                '✅ Acesso autorizado!\n\n' +
                'As fichas completas e os cadastros estão liberados.'
            );
        } catch (erro) {
            senhaAcesso = '';
            autorizado = false;
            registrosPrivados = [];

            atualizarBotoes();

            alert('❌ ' + erro.message);
        } finally {
            btnAcesso.disabled = false;
            atualizarBotoes();
        }
    });


    // -------------------------------------------------

    function abrirFicha(registro) {
        matriculaFichaAtual = registro.matricula;

        const nome = registro.nomeCompleto || 'Sem nome';
        const inicial = nome.trim().charAt(0).toUpperCase() || '?';
        const ferista = registro.tipoCadastro === 'FERISTA';

        const foto = registro.fotoUrl
            ? `<img src="${escaparHTML(registro.fotoUrl)}"

        const campos = [

            ['Escolaridade', registro.escolaridade],
            ['E-mail institucional', registro.emailInstitucional],
            ['Telefone / WhatsApp', registro.telefoneWhatsapp],
            ['Contato de urgência', registro.contatoUrgencia],
            ['Endereço residencial', registro.enderecoResidencial],
            ['Bairro', registro.bairro],
            ['Cidade', registro.cidade],
            ['Setor', registro.setor],

            ['Data de admissão', formatarData(registro.dataAdmissao)],

        const camposHtml = campos.map(function(item) {

        document.getElementById('conteudoFicha').innerHTML = `

                <div class="dgf-foto">

                    ${foto}

                <span class="dgf-selo ${

                </button>

                <button type="button" id="excluirFichaDGF"
                    class="dgf-btn dgf-btn-vermelho">

                </button>
            </div>
        `;

        document.getElementById('editarFichaDGF').onclick = function() {

                alert('Acesso restrito.');
                return;
            }

            const registroAtual = registrosPrivados.find(function(r) {
                return String(r.matricula) === String(matriculaFichaAtual);
            });

            if (!registroAtual) {
                alert('Registro não encontrado para edição.');
                return;
            }

            modalFicha.style.display = 'none';
            abrirFormulario(registroAtual);
        };

        document.getElementById('excluirFichaDGF').onclick = async function() {
            if (!autorizado) {
                alert('Acesso restrito.');
                return;
            }

            if (!confirm(
                'Deseja realmente excluir o cadastro de ' + nome + '?\n\n' +
                'Esta operação não pode ser desfeita.'
            )) {
                return;
            }

            const registroAtual = registrosPrivados.find(function(r) {
                return String(r.matricula) === String(matriculaFichaAtual);
            });

            if (!registroAtual) {
                alert('Não foi possível localizar o registro.');
                return;
            }

            this.disabled = true;
            this.textContent = 'Excluindo...';

            try {
                await enviarAPI('excluir', {

                });

                await recarregarDadosPrivados();
                await recarregarListaPublica();

                alert('Cadastro excluído com sucesso.');
            } catch (erro) {
                alert('Erro ao excluir: ' + erro.message);

    function abrirFormulario(registro) {
        if (!autorizado && registro) {
            alert(
                'Para editar um cadastro existente, ' +
                'é necessário informar a senha corporativa.'
            );
            return;
        }

        formulario.reset();

        document.getElementById('tituloCadastroDGF').textContent =
            registro ? '✏️ Editar cadastro' : '＋ Cadastrar funcionário';

        const campos = formulario.querySelectorAll('[name]');

        campos.forEach(function(campo) {
            const nome = campo.name;

            if (nome === 'id') {
                campo.value = registro ? (registro.id || '') : '';
                return;
            }

            campo.value = registro && registro[nome] != null
                ? registro[nome]
                : '';
        });

        // Libera a seleção entre Regular ou Ferista para qualquer usuário
        const seletorTipo = formulario.elements.namedItem('tipoCadastro');
        if (seletorTipo) {
            seletorTipo.disabled = false;
        }

        previewFoto.removeAttribute('src');
        previewFoto.style.display = 'none';

        if (registro && registro.fotoUrl) {
            previewFoto.src = registro.fotoUrl;
            previewFoto.style.display = 'block';
            inputFoto.required = false;
        } else {
            inputFoto.required = true;
        }

        modalCadastro.style.display = 'flex';
    }


    function comprimirImagem(arquivo) {
        return new Promise(function(resolve, reject) {
            if (!arquivo) {
                resolve('');
                return;
            }

            if (!arquivo.type.startsWith('image/')) {
                reject(new Error('Selecione um arquivo de imagem válido.'));
                return;
            }

            const leitor = new FileReader();

            leitor.onerror = function() {
                reject(new Error('Não foi possível ler a foto.'));
            };

            leitor.onload = function() {
                const imagem = new Image();

                imagem.onerror = function() {
                    reject(new Error('A foto selecionada não pôde ser aberta.'));
                };

                imagem.onload = function() {
                    const limite = 900;

                    const escala = Math.min(
                        1,
                        limite / Math.max(imagem.width, imagem.height)
                    );

                    const canvas = document.createElement('canvas');

                    canvas.width = Math.max(
                        1,
                        Math.round(imagem.width * escala)
                    );

                    canvas.height = Math.max(
                        1,
                        Math.round(imagem.height * escala)
                    );

                    const contexto = canvas.getContext('2d');

                    contexto.drawImage(
                        imagem,
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );

                    try {
                        resolve(canvas.toDataURL('image/jpeg', 0.82));
                    } catch (erro) {
                        reject(new Error('Não foi possível preparar a foto.'));
                    }
                };

                imagem.src = leitor.result;
            };

            leitor.readAsDataURL(arquivo);
        });
    }


    inputFoto.addEventListener('change', function() {
        const arquivo = this.files && this.files[0];

        if (!arquivo) {
            return;
        }

        if (!arquivo.type.startsWith('image/')) {
            alert('Selecione um arquivo de imagem válido.');
            this.value = '';
            return;
        }

        const leitor = new FileReader();

        leitor.onload = function() {
            previewFoto.src = leitor.result;
            previewFoto.style.display = 'block';
        };

        leitor.readAsDataURL(arquivo);
    });


    formulario.addEventListener('submit', async function(evento) {
        evento.preventDefault();

        const idAtual = formulario.elements.namedItem('id').value;

        if (!autorizado && idAtual) {
            alert(
                'Você pode realizar um novo cadastro sem senha. ' +
                'Para editar um cadastro existente, informe a senha corporativa.'
            );
            return;
        }

        const botaoSalvar = document.getElementById('salvarCadastroDGF');
        const arquivo = inputFoto.files && inputFoto.files[0];

        botaoSalvar.disabled = true;
        botaoSalvar.textContent = '⏳ Salvando...';

        try {
            const dados = {};

            new FormData(formulario).forEach(function(valor, chave) {
                if (chave !== 'id') {
                    dados[chave] = valor;
                }
            });

            dados.id = idAtual;

            if (arquivo) {
                dados.fotoData = await comprimirImagem(arquivo);
            }

            await enviarAPI(
                autorizado ? 'salvar' : 'salvarPublico',
                dados
            );

            modalCadastro.style.display = 'none';

            if (autorizado) {
                await recarregarDadosPrivados();
            }

            await recarregarListaPublica();

            alert(
                autorizado
                    ? '✅ Cadastro salvo com sucesso!'
                    : '✅ Cadastro enviado com sucesso!'
            );

        } catch (erro) {
            alert('❌ Não foi possível salvar: ' + erro.message);

        } finally {
            botaoSalvar.disabled = false;
            botaoSalvar.textContent = '💾 Salvar cadastro';
        }
    });


    async function recarregarDadosPrivados() {
        if (!autorizado) {
            return;
        }

        const resposta = await enviarAPI('listarPrivados');

        registrosPrivados = resposta.registros || [];

        renderizarDashboard();
    }


    // -------------------------------------------------
    // DASHBOARD PRIVADO E FILTROS

    btnDashboard.addEventListener('click', function() {
        if (!autorizado) {
            alert('Acesso restrito.');

    function renderizarDashboard() {
        if (!autorizado) {
            return;
        }

        const cidade = (
            document.getElementById('filtroCidadeDash').value || ''
        ).toLowerCase().trim();

        const bairro = (
            document.getElementById('filtroBairroDash').value || ''
        ).toLowerCase().trim();

        const geral = (
            document.getElementById('filtroGeralDash').value || ''
        ).toLowerCase().trim();

        const filtrados = registrosPrivados.filter(function(r) {
            const bateCidade = !cidade ||
                String(r.cidade || '').toLowerCase().includes(cidade);

            const bateBairro = !bairro ||
                String(r.bairro || '').toLowerCase().includes(bairro);

            const bateGeral = !geral ||
                Object.keys(r).some(function(chave) {
                    return String(r[chave] ?? '')
                        .toLowerCase()
                        .includes(geral);
                });

            return bateCidade && bateBairro && bateGeral;
        });

        const corpo = document.getElementById('corpoTabelaDash');

        document.getElementById('qtdRegistrosDash').textContent =
            'Mostrando ' + filtrados.length +
            ' de ' + registrosPrivados.length + ' registro(s).';

        if (!filtrados.length) {
            corpo.innerHTML = `
                <tr>
                    <td colspan="12" style="text-align:center;padding:20px">
                        Nenhum registro encontrado.
                    </td>
                </tr>
            `;
            return;
        }

        corpo.innerHTML = filtrados.map(function(r) {
            const ferista = r.tipoCadastro === 'FERISTA';

            const valores = [
                ferista ? 'FERISTA' : 'REGULAR',
                r.nomeCompleto,
                r.matricula,
                r.cpf,
                r.telefoneWhatsapp,
                r.emailInstitucional,
                r.cidade,
                r.bairro,
                r.setor,
                r.cargo,
                r.loginRede,
                r.loginSEI
            ];

            return `
                <tr class="${ferista ? 'ferista-linha' : ''}">
                    ${valores.map(function(valor) {
                        return '<td>' +
                            escaparHTML(valor || '—') +
                            '</td>';
                    }).join('')}
                </tr>
            `;
        }).join('');
    }


    [
        'filtroCidadeDash',
        'filtroBairroDash',
        'filtroGeralDash'

        document.getElementById(id).addEventListener(

    // Lógica de toggle: fecha as outras abas ativas antes de abrir a selecionada
    window.toggleMesaCoord = function(idCoord) {
        const elementoAlvo = document.getElementById(idCoord);
        const setaAlvo = document.getElementById('seta-' + idCoord);

        if (!elementoAlvo) return;

        const estaFechado = (elementoAlvo.style.display === 'none' || elementoAlvo.style.display === '');

        // 1. Reseta e fecha TODAS as mesas
        document.querySelectorAll('.conteudo-mesa').forEach(conteudo => {
            conteudo.style.display = 'none';
            // Pega o ID do container e altera a seta correspondente para '▶'
            const idMesa = conteudo.id;
            const seta = document.getElementById('seta-' + idMesa);
            if (seta) seta.innerHTML = '▶';
        });

        // 2. Se a mesa clicada estava fechada, abre ela e muda a seta para '▼'
        if (estaFechado) {
            elementoAlvo.style.display = 'flex';
            setaAlvo.innerHTML = '▼';
        }
    };

    window.acenderPcDgf = function(idPc) {
        document.querySelectorAll('.cadeira-dgf').forEach(pc => {
            pc.classList.remove('pc-ativo');
        });

        const pcAlvo = document.getElementById(idPc);
        if (pcAlvo) {
            pcAlvo.classList.add('pc-ativo');
        }
    };
}
